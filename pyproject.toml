[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgn-fix"
version = "0.1.0"
description = "Find and correct mis-recorded chess moves in PGN movetext by checking each move against the actual board position and looking ahead at how the rest of the game plays out."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Chris Ham" },
]
keywords = ["chess", "pgn", "algebraic-notation", "ocr-correction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
    "Intended Audience :: Developers",
]
dependencies = [
    "chess>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/clham/pgn-fix"

[project.scripts]
pgn-fix = "pgn_fix.corrector:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
